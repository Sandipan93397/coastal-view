services:
  - type: web
    name: coastal-view-mandarmani
    env: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: CAPTCHA_POLICY
        value: smart
      - key: TURNSTILE_SITE_KEY
        value: 0x4AAAAAAFdzwcCkPwyd37mU
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        generateValue: true
      - key: TOTP_ISSUER
        value: CoastalViewMandarmani
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        value: reservations@coastalviewmandarmani.com
      - key: MAIL_FROM_NAME
        value: "Coastal View Mandarmani"
      - key: SMTP_DAILY_LIMIT
        value: "300"
